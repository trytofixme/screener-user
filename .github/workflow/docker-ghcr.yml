name: docker-ghcr
on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.java'
      - 'build.gradle*'
      - 'gradle/**'
      - 'Dockerfile'
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build jar
        run: ./gradlew clean build -x test
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/screener-user:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/screener-user:latest
